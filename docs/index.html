<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pcap-lens</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f7f8fb;
        color: #182033;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(720px, calc(100% - 32px));
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.25rem, 8vw, 4.5rem);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        max-width: 58ch;
        margin: 0 0 20px;
        color: #43506a;
        font-size: 1.05rem;
        line-height: 1.6;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      a {
        color: #0f5c8f;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>pcap-lens</h1>
      <p>
        Browser-based PCAP analyzer with protocol decoding, flow graphs, and
        Suricata-style rule matching. The full static app is being published
        here.
      </p>
      <nav aria-label="Project links">
        <a href="https://github.com/baditaflorin/pcap-lens">GitHub repository</a>
        <a href="https://www.paypal.com/paypalme/florinbadita">Support on PayPal</a>
      </nav>
    </main>
  </body>
</html>
